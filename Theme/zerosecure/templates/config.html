<form>
  <div class="form-group">
    <label for="zerosecure_home">ZeroSecure homepage banner</label>
    <select id="zerosecure_home" class="form-control custom-select" name="zerosecure_home">
      <option value="off">Off (keep the existing homepage)</option>
      <option value="on">Show above the existing homepage</option>
    </select>
    <small class="form-text text-muted">Adds the ZeroSecure 2.0 event banner. Existing page content is preserved.</small>
  </div>
  <div class="form-group">
    <label>Challenge Window Size</label>
    <select class="form-control custom-select" name="challenge_window_size">
        <option value="sm">Small</option>
        <option value="norm">Normal</option>
        <option value="lg">Large</option>
        <option value="xl">Extra Large</option>
    </select>
  </div>
  <button type="submit" class="btn btn-primary float-right">Update</button>
</form>
