
services:
  ctfd:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      UPLOAD_FOLDER: /var/uploads
      DATABASE_URL: ${DATABASE_URL:?Database URL required}
      REDIS_URL: ${REDIS_URL:?Redis URL required}
      SECRET_KEY: ${SECRET_KEY:?Secret key required}
      WORKERS: "2"
      LOG_FOLDER: /var/log/CTFd
      ACCESS_LOG: "-"
      ERROR_LOG: "-"
      REVERSE_PROXY: "true"
    volumes:
      - /mnt/ctfd-efs/uploads:/var/uploads
      - ./conf:/opt/CTFd/conf:ro
      - ./CTFd:/opt/CTFd/CTFd:ro
      - ./themes:/opt/CTFd/themes:ro
